[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yt-smzr"
version = "0.1.0"
description = "A local terminal app for summarizing YouTube videos."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # faster-whisper 1.2.x uses metadata_errors, which PyAV 19 no longer accepts.
    "av>=16.1,<17",
    "faster-whisper>=1.2,<2",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic>=2.12,<3",
    "textual>=1,<9",
    "tomlkit>=0.13,<1",
    "tqdm>=4.70,<5",
    "yt-dlp[default]>=2025.10.22",
]

[project.scripts]
yt-smzr = "yt_smzr.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.407,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_smzr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
